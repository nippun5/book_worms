name: book_worms
description: "Book Worms - rate, review, and swap books with fellow readers."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local persistence (acts as the app's on-device database for
  # users, books, reviews, listings and loans)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Remembers the signed-in user between app launches
  shared_preferences: ^2.2.3

  # Auth password hashing
  crypto: ^3.0.3

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates native launcher icons (Android/iOS) from assets/icon/icon.png
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#6B4A32"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
